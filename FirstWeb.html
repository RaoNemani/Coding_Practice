//generate a welcome html page using java script<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title> 
</head>
<body>
    <h1 id="welcome-message"></h1>
    // add another heading to display the current date and time
    <h2 id="current-date-time"></h2>
    

    <script>
        // Function to generate a welcome message
        function generateWelcomeMessage() {
            const welcomeMessage = "Welcome to my website!";
            document.getElementById("welcome-message").textContent = welcomeMessage;
        }

        // Call the function to display the welcome message
        generateWelcomeMessage();
    </script>
